<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>달연어의 작은 도구들</title>
<meta name="description" content="달연어가 만든 작은 프로그램들을 모아 둔 곳">
<meta name="author" content="달연어 (Dal Yeon-eo)">
<meta property="og:title" content="달연어의 작은 도구들">
<meta property="og:description" content="게임하면서, 생활하면서 필요해서 만든 작은 프로그램들">
<meta property="og:image" content="icons/animal-registration.png">
<meta name="theme-color" content="#EDF2E4">
<link rel="icon" href="icons/animal-registration.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column — a small maker header, then a stack of project cards. Add projects in the PROJECTS list in the script. */
:root{
  --bg:#EDF2E4; --paper:#FFFDF6; --ink:#2C3829; --muted:#68745F; --line:#D5DDC6;
  --leaf:#3B8A55; --leaf-soft:#DCEBD8; --sun:#D9A225;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141C16; --paper:#1D2820; --ink:#E7EEDF; --muted:#9AA892; --line:#314031;
  --leaf:#6BC488; --leaf-soft:#22362A; --sun:#EEC45A; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:max(40px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.mark{width:72px;height:72px;border-radius:22px;background:var(--leaf);display:grid;place-items:center;box-shadow:0 10px 24px rgb(30 60 30/.18)}
.mark svg{width:40px;height:40px;color:var(--paper)}
h1{margin:6px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.intro{margin:0;color:var(--muted);font-size:14.5px;max-width:34ch}
.count{font-size:12.5px;font-weight:600;color:var(--leaf);background:var(--leaf-soft);border-radius:999px;padding:3px 12px}
.list{display:flex;flex-direction:column;gap:12px}
.card{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);border-color:var(--leaf);box-shadow:0 8px 20px rgb(30 60 30/.08)}
.card:focus-visible{outline:2px solid var(--leaf);outline-offset:3px}
.card img{width:72px;height:72px;border-radius:18px;object-fit:cover;display:block}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name b{font-size:17px;font-weight:700}
.new{font-size:11px;font-weight:700;color:var(--paper);background:var(--sun);border-radius:4px;padding:1px 6px}
.desc{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.tags span{font-size:11.5px;font-weight:600;color:var(--leaf);background:var(--leaf-soft);border-radius:4px;padding:1px 7px}
.go{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:2px;font-size:13px;color:var(--muted)}
.go strong{color:var(--leaf);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.go svg{width:16px;height:16px}
.soon{border:1.5px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--muted);font-size:13.5px}
footer{text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
footer b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></div>
    <h1>달연어의 작은 도구들</h1>
    <p class="intro">게임하면서, 생활하면서 “이런 게 있으면 좋겠다” 싶어서 만든 것들을 모아 두는 곳이에요.</p>
    <span class="count" id="count"></span>
  </header>

  <main class="list" id="list"></main>

  <footer>
    만든 사람 <b>달연어 (Dal Yeon-eo)</b><br>
    모든 도구는 무료이고, 로그인 없이 쓸 수 있어요.
  </footer>
</div>

<script>
/*
  새 프로그램을 추가하려면 아래 목록 맨 위에 한 덩어리를 복사해서 넣으세요.
  - icon: icons 폴더에 넣은 정사각형 이미지 파일 이름
  - added: 추가한 날짜 (최근 30일 안이면 NEW 표시가 붙어요)
*/
const PROJECTS = [
  {
    name: "우리 섬 주민 등록부",
    desc: "모여봐요 동물의 숲 주민이 섬에 오고, 함께 지내고, 떠나기까지를 기록하는 기록장",
    url: "https://dalyeoneo-cmd.github.io/animal_registration/",
    icon: "icons/animal-registration.png",
    tags: ["모여봐요 동물의 숲", "휴대폰 · PC"],
    added: "2026-10-29"
  },
];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNew = d => { const t = Date.parse(d); return !isNaN(t) && (Date.now() - t) < 30 * 864e5; };
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

document.getElementById("count").textContent = `만든 도구 ${PROJECTS.length}개`;
document.getElementById("list").innerHTML = PROJECTS.map(p => `
  <a class="card" href="${esc(p.url)}">
    <img src="${esc(p.icon)}" alt="">
    <div class="body">
      <div class="name"><b>${esc(p.name)}</b>${isNew(p.added) ? '<span class="new">NEW</span>' : ""}</div>
      <p class="desc">${esc(p.desc)}</p>
      <div class="tags">${(p.tags || []).map(t => `<span>${esc(t)}</span>`).join("")}</div>
    </div>
    <div class="go"><span>${esc((p.added || "").slice(0, 7).replace("-", "."))}</span><strong>열기 ${arrow}</strong></div>
  </a>`).join("") + `<div class="soon">다음 도구를 만들고 있어요 🛠️</div>`;
</script>
</body>
</html>
